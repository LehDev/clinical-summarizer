[project]
name = "clinical-summarizer"
version = "0.1.0"
description = "Serviço Python para geração de resumos clínicos automatizados via LLM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Seu Nome", email = "seu@email.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",  # Para testar endpoints FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_summarizer"]

# ============================================================================
# RUFF - Linter e Formatter
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (ordenação de imports)
    "UP",     # pyupgrade (sintaxe moderna)
    "B",      # flake8-bugbear (bugs comuns)
    "SIM",    # flake8-simplify (simplificações)
]
ignore = [
    "E501",   # linha muito longa (já controlado por line-length)
    "B008",   # function call in default argument (padrão válido do FastAPI)
    "SIM117", # nested with statements (preferimos explícito para clareza)
]

[tool.ruff.lint.isort]
known-first-party = ["clinical_summarizer"]

# ============================================================================
# PYTEST
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Adiciona o src ao PYTHONPATH para imports funcionarem nos testes
pythonpath = ["src"]
addopts = [
    "-v",                    # verbose
    "--tb=short",            # traceback curto em erros
    "--strict-markers",      # erro se usar marker não registrado
]

# ============================================================================
# COVERAGE
# ============================================================================
[tool.coverage.run]
source = ["src/clinical_summarizer"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
